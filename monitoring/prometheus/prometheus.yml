
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus tự giám sát
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Kiểm tra website CRM và kết nối database
  - job_name: crm-website
    metrics_path: /probe

    params:
      module:
        - http_2xx

    static_configs:
      - targets:
          - http://nginx/health
          - http://nginx/health/db

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox:9115

  # Giám sát CPU / RAM Docker containers
  - job_name: cadvisor
    metrics_path: /metrics

    static_configs:
      - targets:
          - cadvisor:8080
